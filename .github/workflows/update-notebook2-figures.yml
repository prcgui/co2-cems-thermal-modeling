name: Update Notebook 2 figures

on:
  push:
    paths:
      - '.github/workflows/update-notebook2-figures.yml'
      - 'scripts/update_notebook2_figures.py'

permissions:
  contents: write

jobs:
  update-notebook:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Insert presentation figure cells
        run: python scripts/update_notebook2_figures.py

      - name: Commit updated notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/02_tratamento_dados.ipynb
          if git diff --cached --quiet; then
            echo "No notebook changes to commit."
          else
            git commit -m "Add presentation figure generation to Notebook 2"
            git push
          fi
